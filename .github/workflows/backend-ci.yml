name: Backend CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # El ejecutor inicia PG18 propio; no utiliza el PostgreSQL del sistema,
      # servicios Docker, .env ni credenciales de bases reales.
      MITBOL_TEST_PG_BIN: /usr/lib/postgresql/18/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Install PostgreSQL 18 binaries
        # ubuntu-24.04 incluye PG16; instalar explícitamente la versión exigida.
        # Repositorio oficial PGDG, con verificación de firma acotada a su clave.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/mitbol-pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-18 postgresql-client-18
          "$MITBOL_TEST_PG_BIN/postgres" --version

      - name: Run complete test suite
        # Mismo ejecutor local: initdb -U mitbol_ci, puertos aleatorios y TCP
        # 127.0.0.1 sin NAT. Contrasta data_directory y detiene ambos clústeres.
        # pytest propaga fallos y errores al estado del job; no se ignora su salida.
        run: python -B scripts/test_auth_phase1.py --with-reader -ra --junitxml=test-results/pytest.xml

      - name: Upload pytest report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-pytest-results
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7
